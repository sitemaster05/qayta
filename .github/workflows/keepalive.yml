# Wakes the free Render instance every 10 minutes so the bot answers without a cold start.
# Set the repository variable QAYTA_BOT_URL to the Render URL (for example https://qayta-bot.onrender.com).
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.QAYTA_BOT_URL != '' }}
    steps:
      - run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 90 "${{ vars.QAYTA_BOT_URL }}" || true
